name: Update SMWCentral Catalog

on:
  workflow_dispatch:
  schedule:
    - cron: "15 9 * * *"

permissions:
  contents: write

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Update catalog
        run: python scripts/Fetch_SMWCentral_All_Hacks.py
      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet -- data/SMWCentral_All_Moderated_Hacks.csv data/SMWCentral_All_Moderated_Hacks.json; then
            echo "No catalog changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/SMWCentral_All_Moderated_Hacks.csv data/SMWCentral_All_Moderated_Hacks.json
          git commit -m "Update SMWCentral catalog"
          git push
