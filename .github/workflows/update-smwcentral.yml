name: Update SMWCentral Catalog

on:
  workflow_dispatch:
  schedule:
    - cron: "15 9 * * *"

permissions:
  contents: write

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Update catalog and build incremental delta
        run: python -u scripts/Fetch_SMWCentral_All_Hacks.py

      - name: Commit catalog changes
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- data)" ]; then
            echo "No catalog changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Update SMWCentral catalog"
          git push
